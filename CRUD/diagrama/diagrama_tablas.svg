<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect width="980" height="520" fill="#ffffff"/>
  <text x="490" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">Diagrama de tablas - Base de datos crud_ventas</text>

  <defs>
    <marker id="muchos" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="16" markerHeight="16" orient="auto">
      <path d="M0,10 L18,10 M18,2 L4,10 L18,18" stroke="#333" stroke-width="2" fill="none"/>
    </marker>
    <marker id="uno" viewBox="0 0 20 20" refX="2" refY="10" markerWidth="16" markerHeight="16" orient="auto">
      <path d="M2,10 L18,10 M8,3 L8,17 M13,3 L13,17" stroke="#333" stroke-width="2" fill="none"/>
    </marker>
  </defs>

  <!-- VENDEDOR -->
  <g transform="translate(40,80)">
    <rect width="260" height="190" fill="#fff" stroke="#1f4e79" stroke-width="2" rx="4"/>
    <rect width="260" height="36" fill="#1f4e79" rx="4"/>
    <text x="130" y="24" text-anchor="middle" fill="#fff" font-weight="bold" font-size="16">vendedor</text>
    <text x="12" y="62"><tspan font-weight="bold" fill="#b8860b">PK</tspan>  id_vendedor : SERIAL</text>
    <text x="12" y="90">      nombre : VARCHAR(50)</text>
    <text x="12" y="118">      apellido : VARCHAR(50)</text>
    <text x="12" y="146">      correo : VARCHAR(100) UNIQUE</text>
    <text x="12" y="174">      telefono : VARCHAR(20)</text>
  </g>

  <!-- PRODUCTO -->
  <g transform="translate(40,300)">
    <rect width="260" height="190" fill="#fff" stroke="#1f4e79" stroke-width="2" rx="4"/>
    <rect width="260" height="36" fill="#1f4e79" rx="4"/>
    <text x="130" y="24" text-anchor="middle" fill="#fff" font-weight="bold" font-size="16">producto</text>
    <text x="12" y="62"><tspan font-weight="bold" fill="#b8860b">PK</tspan>  id_producto : SERIAL</text>
    <text x="12" y="90">      nombre : VARCHAR(100)</text>
    <text x="12" y="118">      descripcion : VARCHAR(255)</text>
    <text x="12" y="146">      precio : NUMERIC(12,2)</text>
    <text x="12" y="174">      stock : INTEGER</text>
  </g>

  <!-- VENTA -->
  <g transform="translate(640,150)">
    <rect width="300" height="218" fill="#fff" stroke="#7a2e2e" stroke-width="2" rx="4"/>
    <rect width="300" height="36" fill="#7a2e2e" rx="4"/>
    <text x="150" y="24" text-anchor="middle" fill="#fff" font-weight="bold" font-size="16">venta</text>
    <text x="12" y="62"><tspan font-weight="bold" fill="#b8860b">PK</tspan>  id_venta : SERIAL</text>
    <text x="12" y="90"><tspan font-weight="bold" fill="#2e7d32">FK</tspan>  id_vendedor : INTEGER</text>
    <text x="12" y="118"><tspan font-weight="bold" fill="#2e7d32">FK</tspan>  id_producto : INTEGER</text>
    <text x="12" y="146">      cantidad : INTEGER</text>
    <text x="12" y="174">      total : NUMERIC(12,2)</text>
    <text x="12" y="202">      fecha : DATE</text>
  </g>

  <!-- relaciones -->
  <path d="M300,142 L470,142 L470,236 L640,236" stroke="#333" stroke-width="2" fill="none" marker-start="url(#uno)" marker-end="url(#muchos)"/>
  <text x="480" y="132" font-size="13" fill="#333">1 vendedor tiene muchas ventas</text>
  <text x="325" y="132" font-size="13" fill="#333">1</text>
  <text x="620" y="228" font-size="12" fill="#333">N</text>

  <path d="M300,362 L470,362 L470,264 L640,264" stroke="#333" stroke-width="2" fill="none" marker-start="url(#uno)" marker-end="url(#muchos)"/>
  <text x="480" y="382" font-size="13" fill="#333">1 producto esta en muchas ventas</text>
  <text x="325" y="352" font-size="13" fill="#333">1</text>
  <text x="620" y="284" font-size="12" fill="#333">N</text>
</svg>
