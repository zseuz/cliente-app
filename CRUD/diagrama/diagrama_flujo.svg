<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="980" height="300" viewBox="0 0 980 300" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect width="980" height="300" fill="#ffffff"/>
  <text x="490" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">Flujo del CRUD</text>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <g text-anchor="middle">
    <rect x="30" y="90" width="190" height="110" rx="10" fill="#fde2e4" stroke="#c0392b" stroke-width="2"/>
    <text x="125" y="128" font-weight="bold" font-size="16">Front (Angular)</text>
    <text x="125" y="152">Vendedores, Productos,</text>
    <text x="125" y="172">Ventas</text>

    <rect x="290" y="90" width="190" height="110" rx="10" fill="#e3f2e1" stroke="#2e7d32" stroke-width="2"/>
    <text x="385" y="128" font-weight="bold" font-size="16">Routes</text>
    <text x="385" y="152">/api/vendedores</text>
    <text x="385" y="172">/api/productos  /api/ventas</text>

    <rect x="550" y="90" width="170" height="110" rx="10" fill="#e3f2e1" stroke="#2e7d32" stroke-width="2"/>
    <text x="635" y="128" font-weight="bold" font-size="16">Controller</text>
    <text x="635" y="152">valida los datos y</text>
    <text x="635" y="172">responde JSON</text>

    <rect x="780" y="90" width="170" height="110" rx="10" fill="#e3f2e1" stroke="#2e7d32" stroke-width="2"/>
    <text x="865" y="128" font-weight="bold" font-size="16">Model</text>
    <text x="865" y="152">consultas SQL</text>
    <text x="865" y="172">(pg)</text>

    <ellipse cx="865" cy="262" rx="85" ry="26" fill="#dbe9f6" stroke="#1f4e79" stroke-width="2"/>
    <text x="865" y="267" font-weight="bold">PostgreSQL</text>

    <text x="512" y="75" fill="#2e7d32" font-weight="bold">Back (Node + Express)</text>
  </g>
  <rect x="270" y="60" width="700" height="160" rx="12" fill="none" stroke="#2e7d32" stroke-dasharray="6 4"/>

  <line x1="220" y1="135" x2="288" y2="135" stroke="#333" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="288" y1="160" x2="222" y2="160" stroke="#333" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="254" y="128" text-anchor="middle" font-size="11">HTTP</text>
  <text x="254" y="178" text-anchor="middle" font-size="11">JSON</text>
  <line x1="480" y1="145" x2="548" y2="145" stroke="#333" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="720" y1="145" x2="778" y2="145" stroke="#333" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="865" y1="200" x2="865" y2="234" stroke="#333" stroke-width="2" marker-end="url(#flecha)"/>
</svg>
