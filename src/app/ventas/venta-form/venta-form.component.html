<div class="card shadow-sm mx-auto" style="max-width: 820px">
  <div class="card-body">
    <h5 class="card-title mb-3">{{ isEdit ? 'Editar venta #' + id : 'Registrar venta' }}</h5>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <fieldset [disabled]="loading || saving">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="vendedorId">Vendedor *</label>
            <select id="vendedorId" class="form-select" formControlName="vendedorId" [class.is-invalid]="isInvalid('vendedorId')">
              <option [ngValue]="0" disabled>Seleccione…</option>
              <option *ngFor="let v of vendedoresDisponibles" [ngValue]="v.id">
                {{ v.nombre }} {{ v.apellido }}{{ v.activo ? '' : ' (inactivo)' }}
              </option>
            </select>
            <app-control-error [control]="form.controls.vendedorId"></app-control-error>
          </div>

          <div class="col-md-6">
            <label class="form-label" for="productoId">Producto *</label>
            <select id="productoId" class="form-select" formControlName="productoId" [class.is-invalid]="isInvalid('productoId')">
              <option [ngValue]="0" disabled>Seleccione…</option>
              <option *ngFor="let p of productosDisponibles" [ngValue]="p.id" [disabled]="p.stock === 0 && p.id !== original?.productoId">
                {{ p.codigo }} — {{ p.nombre }} (stock {{ p.stock }})
              </option>
            </select>
            <app-control-error [control]="form.controls.productoId"></app-control-error>
          </div>

          <div class="col-md-4">
            <label class="form-label" for="cantidad">Cantidad *</label>
            <input id="cantidad" type="number" min="1" step="1" class="form-control" formControlName="cantidad"
              [class.is-invalid]="isInvalid('cantidad') || excedeStock" />
            <app-control-error [control]="form.controls.cantidad"></app-control-error>
            <div class="form-text" *ngIf="productoSeleccionado" [class.text-danger]="excedeStock">
              Disponible: {{ stockDisponible }} unidades
            </div>
          </div>

          <div class="col-md-8">
            <label class="form-label" for="fecha">Fecha *</label>
            <input id="fecha" type="datetime-local" class="form-control" formControlName="fecha" [max]="maxFecha"
              [class.is-invalid]="isInvalid('fecha')" />
            <app-control-error [control]="form.controls.fecha"></app-control-error>
          </div>

          <div class="col-12">
            <label class="form-label" for="observaciones">Observaciones</label>
            <input id="observaciones" class="form-control" formControlName="observaciones" maxlength="255"
              [class.is-invalid]="isInvalid('observaciones')" />
            <app-control-error [control]="form.controls.observaciones"></app-control-error>
          </div>
        </div>

        <div class="bg-light border rounded p-3 mt-4 d-flex flex-wrap justify-content-between gap-2" *ngIf="productoSeleccionado">
          <span>Precio unitario: <strong>{{ precioUnitario | currency: 'COP':'symbol-narrow':'1.0-2' }}</strong>
            <small class="text-muted ms-1" *ngIf="isEdit && original?.productoId === productoSeleccionado.id">(precio histórico)</small>
          </span>
          <span class="fs-5">Total: <strong>{{ total | currency: 'COP':'symbol-narrow':'1.0-2' }}</strong></span>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4">
          <a class="btn btn-outline-secondary" routerLink="/ventas">Cancelar</a>
          <button type="submit" class="btn btn-primary">
            <span *ngIf="saving" class="spinner-border spinner-border-sm me-1"></span>
            {{ isEdit ? 'Guardar cambios' : 'Registrar venta' }}
          </button>
        </div>
      </fieldset>
    </form>
  </div>
</div>
