<div class="card shadow-sm mx-auto" style="max-width: 720px">
  <div class="card-body">
    <h5 class="card-title mb-3">{{ isEdit ? 'Editar vendedor #' + id : 'Nuevo vendedor' }}</h5>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <fieldset [disabled]="loading || saving">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="nombre">Nombre *</label>
            <input id="nombre" class="form-control" formControlName="nombre" [class.is-invalid]="isInvalid('nombre')" />
            <app-control-error [control]="form.controls.nombre"></app-control-error>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="apellido">Apellido *</label>
            <input id="apellido" class="form-control" formControlName="apellido" [class.is-invalid]="isInvalid('apellido')" />
            <app-control-error [control]="form.controls.apellido"></app-control-error>
          </div>
          <div class="col-md-7">
            <label class="form-label" for="email">Email *</label>
            <input id="email" type="email" class="form-control" formControlName="email" [class.is-invalid]="isInvalid('email')" />
            <app-control-error [control]="form.controls.email"></app-control-error>
          </div>
          <div class="col-md-5">
            <label class="form-label" for="telefono">Teléfono</label>
            <input id="telefono" class="form-control" formControlName="telefono" [class.is-invalid]="isInvalid('telefono')" />
            <app-control-error [control]="form.controls.telefono"></app-control-error>
          </div>
          <div class="col-12">
            <div class="form-check form-switch">
              <input id="activo" class="form-check-input" type="checkbox" formControlName="activo" />
              <label class="form-check-label" for="activo">Activo (puede registrar ventas)</label>
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4">
          <a class="btn btn-outline-secondary" routerLink="/vendedores">Cancelar</a>
          <button type="submit" class="btn btn-primary">
            <span *ngIf="saving" class="spinner-border spinner-border-sm me-1"></span>
            {{ isEdit ? 'Guardar cambios' : 'Crear vendedor' }}
          </button>
        </div>
      </fieldset>
    </form>
  </div>
</div>
