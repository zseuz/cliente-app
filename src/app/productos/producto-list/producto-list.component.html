<div class="card shadow-sm">
  <div class="card-body">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h5 class="card-title mb-0">Productos</h5>
        <small class="text-muted">Catálogo e inventario</small>
      </div>
      <div class="d-flex gap-2">
        <input type="search" class="form-control" placeholder="Buscar por código o nombre…" [formControl]="search" />
        <a class="btn btn-primary text-nowrap" routerLink="nuevo">+ Nuevo</a>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle mb-2">
        <thead class="table-light">
          <tr>
            <th>Código</th>
            <th>Nombre</th>
            <th class="text-end">Precio</th>
            <th class="text-end">Stock</th>
            <th>Estado</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let p of items; trackBy: trackById">
            <td><code>{{ p.codigo }}</code></td>
            <td>
              {{ p.nombre }}
              <div class="small text-muted text-truncate" style="max-width: 320px" *ngIf="p.descripcion">{{ p.descripcion }}</div>
            </td>
            <td class="text-end">{{ p.precio | currency: 'COP':'symbol-narrow':'1.0-2' }}</td>
            <td class="text-end">
              <span [class.text-danger]="p.stock <= lowStock" [class.fw-bold]="p.stock <= lowStock">{{ p.stock }}</span>
            </td>
            <td>
              <span class="badge" [ngClass]="p.activo ? 'bg-success' : 'bg-secondary'">{{ p.activo ? 'Activo' : 'Inactivo' }}</span>
            </td>
            <td class="text-end text-nowrap">
              <a class="btn btn-sm btn-outline-primary me-1" [routerLink]="[p.id, 'editar']">Editar</a>
              <button class="btn btn-sm btn-outline-danger" (click)="remove(p, 'el producto ' + p.nombre)">Eliminar</button>
            </td>
          </tr>
          <tr *ngIf="!loading && items.length === 0">
            <td colspan="6" class="text-center text-muted py-4">No hay productos registrados</td>
          </tr>
          <tr *ngIf="loading && items.length === 0">
            <td colspan="6" class="text-center py-4"><div class="spinner-border spinner-border-sm"></div> Cargando…</td>
          </tr>
        </tbody>
      </table>
    </div>

    <app-pager [meta]="meta" (pageChange)="goTo($event)"></app-pager>
  </div>
</div>
