<div class="card shadow-sm mx-auto" style="max-width: 720px">
  <div class="card-body">
    <h5 class="card-title mb-3">{{ isEdit ? 'Editar producto #' + id : 'Nuevo producto' }}</h5>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <fieldset [disabled]="loading || saving">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label" for="codigo">Código *</label>
            <input id="codigo" class="form-control text-uppercase" formControlName="codigo" [class.is-invalid]="isInvalid('codigo')" />
            <app-control-error [control]="form.controls.codigo"></app-control-error>
          </div>
          <div class="col-md-8">
            <label class="form-label" for="nombre">Nombre *</label>
            <input id="nombre" class="form-control" formControlName="nombre" [class.is-invalid]="isInvalid('nombre')" />
            <app-control-error [control]="form.controls.nombre"></app-control-error>
          </div>
          <div class="col-12">
            <label class="form-label" for="descripcion">Descripción</label>
            <textarea id="descripcion" rows="3" class="form-control" formControlName="descripcion" [class.is-invalid]="isInvalid('descripcion')"></textarea>
            <app-control-error [control]="form.controls.descripcion"></app-control-error>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="precio">Precio unitario *</label>
            <div class="input-group">
              <span class="input-group-text">$</span>
              <input id="precio" type="number" min="0" step="0.01" class="form-control" formControlName="precio" [class.is-invalid]="isInvalid('precio')" />
            </div>
            <app-control-error [control]="form.controls.precio"></app-control-error>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="stock">Stock *</label>
            <input id="stock" type="number" min="0" step="1" class="form-control" formControlName="stock" [class.is-invalid]="isInvalid('stock')" />
            <app-control-error [control]="form.controls.stock"></app-control-error>
          </div>
          <div class="col-12">
            <div class="form-check form-switch">
              <input id="activo" class="form-check-input" type="checkbox" formControlName="activo" />
              <label class="form-check-label" for="activo">Activo (disponible para la venta)</label>
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4">
          <a class="btn btn-outline-secondary" routerLink="/productos">Cancelar</a>
          <button type="submit" class="btn btn-primary">
            <span *ngIf="saving" class="spinner-border spinner-border-sm me-1"></span>
            {{ isEdit ? 'Guardar cambios' : 'Crear producto' }}
          </button>
        </div>
      </fieldset>
    </form>
  </div>
</div>
